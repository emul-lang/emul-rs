[package]
name = "emul"
version = "0.1.0"
edition = "2024"
description = "Compiler for the Emul design language: renders compositions to HTML, SVG and PNG"
license = "MIT"

[dependencies]
taffy = "0.15"
cosmic-text = "0.19"
resvg = "0.49"
usvg = "0.49"
tiny-skia = "0.12"
ttf-parser = "0.25"
clap = { version = "4", features = ["derive"] }
ureq = "3"
base64 = "0.23"
serde_json = "1"
dirs = "7"
tiny_http = "0.12"
eframe = "0.37"
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
notify = "8"

[profile.dev.package."*"]
opt-level = 2

[workspace]
members = ["xtask"]
